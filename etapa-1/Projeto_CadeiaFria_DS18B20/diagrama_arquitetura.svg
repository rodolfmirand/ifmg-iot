<svg viewBox="0 0 1650 840" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1650" height="840" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="825" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Arquitetura — Monitor de Cadeia Fria (NTC 10k B3950 + Buzzer)</text>
  <text x="825" y="62" text-anchor="middle" font-size="14" fill="#475569">Internet das Coisas III — Etapa 1 — IFMG Campus Ouro Branco</text>

  <!-- ==================== TOP FLOW LABEL ==================== -->
  <text x="100" y="95" font-size="13" font-weight="600" fill="#2563EB">Fluxo de telemetria (sensor → usuário)</text>

  <!-- vertical stubs blue (top, y100 -> box top 140). Origem: Sensor (sem seta). Demais: seta de chegada em cada caixa. -->
  <line x1="165" y1="100" x2="165" y2="140" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="355" y1="100" x2="355" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="545" y1="100" x2="545" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="735" y1="100" x2="735" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="925" y1="100" x2="925" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1115" y1="100" x2="1115" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="1305" y1="100" x2="1305" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <!-- horizontal blue line -->
  <line x1="165" y1="100" x2="1490" y2="100" stroke="#2563EB" stroke-width="2.5"/>
  <!-- final stub into Usuario box with arrowhead -->
  <line x1="1495" y1="100" x2="1495" y2="138" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ==================== BOTTOM FLOW LABEL ==================== -->
  <text x="1160" y="330" font-size="13" font-weight="600" fill="#EA580C" text-anchor="end">Fluxo de comando (usuário → atuador)</text>

  <!-- origem: Usuário inicia o comando (sem seta de chegada) -->
  <line x1="1495" y1="260" x2="1495" y2="300" stroke="#EA580C" stroke-width="2.5"/>
  <!-- horizontal orange line from Usuario(1495) to ESP32(355), passing under (skipping) Banco 1115 -->
  <line x1="1495" y1="300" x2="355" y2="300" stroke="#EA580C" stroke-width="2.5"/>
  <!-- setas de chegada em cada salto: Web, Gateway (pula o Banco), Broker, Wi-Fi, ESP32 -->
  <line x1="1305" y1="300" x2="1305" y2="262" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="925" y1="300" x2="925" y2="262" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="735" y1="300" x2="735" y2="262" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="545" y1="300" x2="545" y2="262" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <line x1="355" y1="300" x2="355" y2="262" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <!-- fio local: ESP32 aciona o Atuador (fisicamente, não via rede) -->
  <line x1="355" y1="300" x2="355" y2="498" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="380" y="400" font-size="10" fill="#EA580C" font-style="italic">fio (local)</text>

  <!-- ================= MAIN ROW BOXES ================= -->
  <!-- 1. Sensor DS18B20 -->
  <g transform="translate(100,140)">
    <rect width="130" height="120" rx="12" fill="#0F766E"/>
    <g transform="translate(65,42)">
      <path d="M-22,-26 q7,8 0,16 q-7,8 0,16" stroke="#F0FDFA" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="-22" y1="6" x2="-9" y2="6" stroke="#F0FDFA" stroke-width="3" stroke-linecap="round"/>
      <rect x="-9" y="-4" width="18" height="32" rx="9" fill="#F0FDFA"/>
      <path d="M-4,4 l3,-5 l3,10 l3,-10 l3,10 l3,-5" stroke="#0F766E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">Sensor</text>
    <text x="65" y="106" text-anchor="middle" font-size="10.5" fill="#CCFBF1">NTC 10k B3950</text>
  </g>

  <!-- 2. ESP32 -->
  <g transform="translate(290,140)">
    <rect width="130" height="120" rx="12" fill="#0F766E"/>
    <g transform="translate(65,42)">
      <rect x="-27" y="-16" width="54" height="32" rx="3" fill="#F0FDFA"/>
      <rect x="-10" y="-8" width="20" height="16" fill="#0F766E"/>
      <g stroke="#F0FDFA" stroke-width="2">
        <line x1="-27" y1="-11" x2="-34" y2="-11"/>
        <line x1="-27" y1="-3" x2="-34" y2="-3"/>
        <line x1="-27" y1="5" x2="-34" y2="5"/>
        <line x1="-27" y1="13" x2="-34" y2="13"/>
        <line x1="27" y1="-11" x2="34" y2="-11"/>
        <line x1="27" y1="-3" x2="34" y2="-3"/>
        <line x1="27" y1="5" x2="34" y2="5"/>
        <line x1="27" y1="13" x2="34" y2="13"/>
      </g>
      <path d="M18,-16 L24,-24 L20,-24 L26,-32" stroke="#F0FDFA" stroke-width="2" fill="none"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">ESP32</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#CCFBF1">DevKit</text>
  </g>

  <!-- 3. Wi-Fi -->
  <g transform="translate(480,140)">
    <rect width="130" height="120" rx="12" fill="#0F766E"/>
    <g transform="translate(65,46)" stroke="#F0FDFA" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-24,0 A34,34 0 0 1 24,0"/>
      <path d="M-15,10 A20,20 0 0 1 15,10"/>
      <path d="M-6,20 A9,9 0 0 1 6,20"/>
    </g>
    <circle cx="65" cy="76" r="4" fill="#F0FDFA"/>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">Wi-Fi</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#CCFBF1">Rede local (STA)</text>
  </g>

  <!-- 4. MQTT Broker -->
  <g transform="translate(670,140)">
    <rect width="130" height="120" rx="12" fill="#0F766E"/>
    <g transform="translate(65,40)">
      <path d="M-26,10 a14,14 0 0 1 3,-27 a17,17 0 0 1 32,-3 a13,13 0 0 1 2,26 Z" fill="#F0FDFA"/>
      <path d="M-10,4 L2,4 L2,-4 L10,6 L2,16 L2,8 L-10,8 Z" fill="#0F766E" transform="translate(0,3) scale(0.9)"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="white">Broker MQTT</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#CCFBF1">Pub/Sub</text>
  </g>

  <!-- 5. Gateway (futuro) -->
  <g transform="translate(860,140)">
    <rect width="130" height="120" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(65,42)">
      <path d="M-24,8 a13,13 0 0 1 3,-25 a16,16 0 0 1 30,-3 a12,12 0 0 1 2,24 Z" fill="#CBD5E1"/>
      <circle cx="0" cy="2" r="7" fill="none" stroke="#64748B" stroke-width="2.5"/>
      <g stroke="#64748B" stroke-width="2.5">
        <line x1="0" y1="-10" x2="0" y2="-6"/>
        <line x1="0" y1="10" x2="0" y2="14"/>
        <line x1="-10" y1="2" x2="-6" y2="2"/>
        <line x1="10" y1="2" x2="6" y2="2"/>
      </g>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Gateway</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#64748B">Nuvem (futuro)</text>
  </g>

  <!-- 6. Banco de dados (futuro) -->
  <g transform="translate(1050,140)">
    <rect width="130" height="120" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(65,42)">
      <ellipse cx="0" cy="-14" rx="20" ry="7" fill="#CBD5E1"/>
      <path d="M-20,-14 L-20,14 A20,7 0 0 0 20,14 L20,-14" fill="#CBD5E1"/>
      <ellipse cx="0" cy="14" rx="20" ry="7" fill="#94A3B8"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Banco</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#64748B">Chave-valor (futuro)</text>
  </g>

  <!-- 7. Sistema Web (futuro) -->
  <g transform="translate(1240,140)">
    <rect width="130" height="120" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(65,42)">
      <rect x="-24" y="-18" width="48" height="36" rx="3" fill="#CBD5E1"/>
      <rect x="-24" y="-18" width="48" height="9" rx="3" fill="#94A3B8"/>
      <circle cx="-18" cy="-13.5" r="1.6" fill="#F1F5F9"/>
      <circle cx="-13" cy="-13.5" r="1.6" fill="#F1F5F9"/>
      <polyline points="-16,10 -6,-2 2,4 16,-10" fill="none" stroke="#334155" stroke-width="2.2"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Sistema Web</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#64748B">Painel (futuro)</text>
  </g>

  <!-- 8. Usuario -->
  <g transform="translate(1430,140)">
    <rect width="130" height="120" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(65,44)">
      <circle cx="0" cy="-10" r="12" fill="#CBD5E1"/>
      <path d="M-20,22 a20,18 0 0 1 40,0 Z" fill="#CBD5E1"/>
    </g>
    <text x="65" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Usuário</text>
    <text x="65" y="106" text-anchor="middle" font-size="11" fill="#64748B">Técnico responsável</text>
  </g>

  <!-- Atuador (buzzer) box, below ESP32 -->
  <g transform="translate(290,500)">
    <rect width="130" height="100" rx="12" fill="#0F766E"/>
    <g transform="translate(65,38)">
      <rect x="-16" y="-10" width="12" height="20" fill="#F0FDFA"/>
      <path d="M-4,-10 L14,-20 L14,20 L-4,10 Z" fill="#F0FDFA"/>
      <g stroke="#F0FDFA" stroke-width="2.2" fill="none" stroke-linecap="round">
        <path d="M20,-10 A16,16 0 0 1 20,10"/>
        <path d="M25,-16 A24,24 0 0 1 25,16"/>
      </g>
    </g>
    <text x="65" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="white">Atuador</text>
    <text x="65" y="92" text-anchor="middle" font-size="11" fill="#CCFBF1">Buzzer</text>
  </g>

  <!-- physical wire note: ESP32 - Atuador (already connected via orange arrow) -->
  <!-- physical wire: Sensor - ESP32 (short local link marker) -->
  <text x="230" y="130" text-anchor="middle" font-size="10" fill="#0F766E" font-style="italic">fio (analógico)</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(100,640)">
    <rect x="0" y="0" width="1460" height="150" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="26" font-size="14" font-weight="700" fill="#0F172A">Legenda</text>

    <rect x="20" y="40" width="18" height="18" rx="4" fill="#0F766E"/>
    <text x="46" y="53" font-size="12.5" fill="#334155">Implementado na Etapa 1 (sensor, ESP32, Wi-Fi, broker, atuador)</text>

    <rect x="20" y="66" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="46" y="79" font-size="12.5" fill="#334155">Etapas futuras (aparece no diagrama, mas não é implementado agora)</text>

    <line x1="20" y1="96" x2="38" y2="96" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="46" y="100" font-size="12.5" fill="#334155">Fluxo de telemetria — publica em .../telemetry e .../availability</text>

    <line x1="20" y1="118" x2="38" y2="118" stroke="#EA580C" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <text x="46" y="122" font-size="12.5" fill="#334155">Fluxo de comando — publica em .../command, ESP32 responde em .../state</text>

    <text x="640" y="40" font-size="13" font-weight="700" fill="#0F172A">Tópicos MQTT (base):</text>
    <text x="640" y="60" font-size="12" fill="#334155">ifmg/iot3/&lt;turma&gt;/&lt;aluno&gt;/esp32/telemetry</text>
    <text x="640" y="78" font-size="12" fill="#334155">ifmg/iot3/&lt;turma&gt;/&lt;aluno&gt;/esp32/command</text>
    <text x="640" y="96" font-size="12" fill="#334155">ifmg/iot3/&lt;turma&gt;/&lt;aluno&gt;/esp32/state</text>
    <text x="640" y="114" font-size="12" fill="#334155">ifmg/iot3/&lt;turma&gt;/&lt;aluno&gt;/esp32/availability</text>

    <text x="1080" y="40" font-size="13" font-weight="700" fill="#0F172A">Nota:</text>
    <text x="1080" y="60" font-size="11.5" fill="#334155">Sensor–ESP32 e ESP32–Atuador</text>
    <text x="1080" y="76" font-size="11.5" fill="#334155">são conexões elétricas locais.</text>
    <text x="1080" y="92" font-size="11.5" fill="#334155">NTC em divisor de tensão com</text>
    <text x="1080" y="108" font-size="11.5" fill="#334155">resistor 10k, lido no GPIO34 (ADC).</text>
  </g>
</svg>
