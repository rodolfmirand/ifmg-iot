<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="none" stroke="#000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <!-- Caixas -->
  <rect x="10"  y="40" width="140" height="70" rx="4" stroke-width="1.5"/>
  <rect x="200" y="40" width="150" height="70" rx="4" stroke-width="1.5"/>
  <rect x="400" y="40" width="150" height="70" rx="4" stroke-width="1.5"/>
  <rect x="600" y="40" width="110" height="70" rx="4" stroke-width="1.5"/>
  <rect x="400" y="165" width="150" height="45" rx="4" stroke-width="1.5" stroke-dasharray="5 3"/>

  <g fill="#000" stroke="none" text-anchor="middle">
    <text x="80"  y="68" font-weight="bold">ESP32</text>
    <text x="80"  y="86" font-size="10.5">DS18B20 (GPIO 19)</text>
    <text x="80"  y="100" font-size="10.5">LED (GPIO 4)</text>

    <text x="275" y="68" font-weight="bold">Broker MQTT</text>
    <text x="275" y="86" font-size="10.5">broker.hivemq.com</text>
    <text x="275" y="100" font-size="10.5">porta 1883</text>

    <text x="475" y="68" font-weight="bold">Gateway Node.js</text>
    <text x="475" y="86" font-size="10.5">validação JSON</text>
    <text x="475" y="100" font-size="10.5">persistência</text>

    <text x="655" y="72" font-weight="bold">Redis 7</text>
    <text x="655" y="90" font-size="10.5">(Docker)</text>

    <text x="475" y="185" font-weight="bold">query.js</text>
    <text x="475" y="200" font-size="10.5">consultas (CLI)</text>

    <!-- Rótulos das setas -->
    <text x="175" y="52" font-size="10">publica</text>
    <text x="175" y="128" font-size="10">command</text>
    <text x="375" y="52" font-size="10">assina</text>
    <text x="575" y="52" font-size="10">grava</text>
    <text x="600" y="181" font-size="10">lê</text>
  </g>

  <!-- Setas -->
  <path d="M150 62H198" marker-end="url(#a)" stroke-width="1.3"/>
  <path d="M198 92H152" marker-end="url(#a)" stroke-width="1.3"/>
  <path d="M350 75H398" marker-end="url(#a)" stroke-width="1.3"/>
  <path d="M550 75H598" marker-end="url(#a)" stroke-width="1.3"/>
  <!-- query.js lê o Redis -->
  <path d="M550 187H655V112" marker-end="url(#a)" stroke-width="1.3"/>

  <g fill="#000" stroke="none" font-size="9.5">
    <text x="10" y="20">Tópicos: ifmg/iot3/2026-1/rodolfo/esp32cadeiafria/{telemetry, command, state, availability}</text>
  </g>
</svg>
